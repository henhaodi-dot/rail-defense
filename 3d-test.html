<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8cfe0">
<title>3D 引擎测试 · 雪地轨道</title>
<style>
*{margin:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#b8cfe0;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#fps{position:fixed;top:env(safe-area-inset-top);left:8px;
     color:#fff;font:600 13px/1 ui-monospace,monospace;
     background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px;
     z-index:10;pointer-events:none;}
#label{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;
       text-align:center;color:#fff;font:600 13px/1.5 system-ui;
       text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none;z-index:10;}
</style>
</head>
<body>
<div id="fps">-- fps</div>
<div id="label">Three.js · 手机性能测试<br>双指拖动旋转 · 捏合缩放</div>
<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ============ renderer ============ */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b8cfe0');
scene.fog = new THREE.Fog('#b8cfe0', 30, 60);

/* ============ camera ============ */
const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(12, 14, 12);
camera.lookAt(0, 0, 0);

/* ============ lights ============ */
const amb = new THREE.AmbientLight('#c0d8f0', 0.6);
scene.add(amb);
const sun = new THREE.DirectionalLight('#fff5e0', 1.1);
sun.position.set(8, 15, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.002;
scene.add(sun);

/* ============ materials ============ */
const mat = {
  snow:  new THREE.MeshStandardMaterial({color:'#e8eef4', roughness:0.85}),
  wood:  new THREE.MeshStandardMaterial({color:'#b07840', roughness:0.7}),
  woodD: new THREE.MeshStandardMaterial({color:'#8a5a2c', roughness:0.7}),
  rail:  new THREE.MeshStandardMaterial({color:'#5a4a40', roughness:0.5, metalness:0.3}),
  metal: new THREE.MeshStandardMaterial({color:'#8899a6', roughness:0.4, metalness:0.5}),
  red:   new THREE.MeshStandardMaterial({color:'#c04030', roughness:0.6}),
  green: new THREE.MeshStandardMaterial({color:'#4a8a50', roughness:0.7}),
  greenD:new THREE.MeshStandardMaterial({color:'#366838', roughness:0.7}),
  cart:  new THREE.MeshStandardMaterial({color:'#d09040', roughness:0.5}),
  gold:  new THREE.MeshStandardMaterial({color:'#e8c040', roughness:0.3, metalness:0.6}),
  fence: new THREE.MeshStandardMaterial({color:'#c8b89a', roughness:0.8}),
};

/* ============ ground ============ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  mat.snow
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// snow mounds
for(let i=0; i<12; i++){
  const r = 1.5 + Math.random()*2;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8, 0, Math.PI*2, 0, Math.PI/2), mat.snow);
  m.position.set((Math.random()-.5)*28, 0, (Math.random()-.5)*28);
  m.scale.y = 0.3 + Math.random()*0.2;
  m.receiveShadow = true;
  scene.add(m);
}

/* ============ trees ============ */
function makeTree(x, z, h){
  const g = new THREE.Group();
  // trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.12,.15, h*.3, 6), mat.wood);
  trunk.position.y = h*.15; trunk.castShadow=true; g.add(trunk);
  // layers
  const layers = 3 + Math.floor(Math.random()*2);
  for(let i=0; i<layers; i++){
    const t = i/layers;
    const r = (1-t*0.7) * h*0.35;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(r, h/layers*1.1, 7),
      i%2===0 ? mat.green : mat.greenD
    );
    cone.position.y = h*0.3 + (h*0.7)*(i+0.5)/layers;
    cone.castShadow = true; cone.receiveShadow = true;
    g.add(cone);
  }
  // snow caps
  for(let i=0; i<layers; i++){
    const t = i/layers;
    const r = (1-t*0.7) * h*0.33;
    const cap = new THREE.Mesh(
      new THREE.ConeGeometry(r, 0.15, 7),
      mat.snow
    );
    cap.position.y = h*0.3 + (h*0.7)*(i+1)/layers - 0.1;
    g.add(cap);
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
const treePositions = [
  [-8,-6], [-7,-8], [-9,-3], [-6,-9], [-10,-5],
  [7,-7], [9,-5], [8,-9], [10,-7],
  [-7,7], [-9,5], [-8,9], [-6,6],
  [8,7], [7,9], [9,6], [10,8],
  [-4,-10],[4,-10],[0,-11],
];
treePositions.forEach(([x,z]) => makeTree(x, z, 2.5+Math.random()*1.5));

/* ============ rail track ============ */
const trackPts = [
  new THREE.Vector3(-5, 0.05, 5),
  new THREE.Vector3(-5, 0.05, 0),
  new THREE.Vector3(-3, 0.05, -3),
  new THREE.Vector3(0, 0.05, -4),
  new THREE.Vector3(3, 0.05, -3),
  new THREE.Vector3(5, 0.05, 0),
  new THREE.Vector3(5, 0.05, 4),
  new THREE.Vector3(3, 0.05, 6),
  new THREE.Vector3(0, 0.05, 6),
  new THREE.Vector3(-3, 0.05, 6),
  new THREE.Vector3(-5, 0.05, 5),
];
const curve = new THREE.CatmullRomCurve3(trackPts, false, 'catmullrom', 0.3);

// rails
const railShape = new THREE.Shape();
railShape.moveTo(-0.04, 0); railShape.lineTo(0.04, 0);
railShape.lineTo(0.04, 0.06); railShape.lineTo(-0.04, 0.06);

const extrudeSettings = { steps: 120, extrudePath: curve };

// left rail
const offsetCurve = (offset) => {
  const pts = [];
  for(let i=0; i<=120; i++){
    const t = i/120;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t);
    const up = new THREE.Vector3(0,1,0);
    const normal = new THREE.Vector3().crossVectors(up, tangent).normalize();
    pts.push(new THREE.Vector3(p.x + normal.x*offset, p.y, p.z + normal.z*offset));
  }
  return new THREE.CatmullRomCurve3(pts);
};
const leftCurve = offsetCurve(0.22);
const rightCurve = offsetCurve(-0.22);

const leftRail = new THREE.Mesh(
  new THREE.TubeGeometry(leftCurve, 100, 0.04, 4, false),
  mat.rail
);
leftRail.castShadow = true;
scene.add(leftRail);

const rightRail = new THREE.Mesh(
  new THREE.TubeGeometry(rightCurve, 100, 0.04, 4, false),
  mat.rail
);
rightRail.castShadow = true;
scene.add(rightRail);

// sleepers (ties)
for(let i=0; i<80; i++){
  const t = i/80;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t);
  const tie = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.6), mat.woodD);
  tie.position.copy(p);
  tie.position.y = 0.02;
  tie.rotation.y = Math.atan2(tan.x, tan.z);
  tie.castShadow = true;
  scene.add(tie);
}

/* ============ towers ============ */
function makeTower(x, z, h){
  const g = new THREE.Group();
  // 4 posts
  const postH = h;
  for(const [dx,dz] of [[-0.35,-0.35],[0.35,-0.35],[0.35,0.35],[-0.35,0.35]]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.07,.09, postH, 6), mat.wood);
    post.position.set(dx, postH/2, dz);
    post.castShadow = true;
    g.add(post);
  }
  // platform
  const plat = new THREE.Mesh(new THREE.BoxGeometry(1, 0.08, 1), mat.wood);
  plat.position.y = postH * 0.7;
  plat.castShadow = true; plat.receiveShadow = true;
  g.add(plat);
  // roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.5, 4), mat.red);
  roof.position.y = postH * 0.7 + 0.5;
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  g.add(roof);
  // crossbeams
  for(const dy of [postH*0.25, postH*0.5]){
    for(const side of [0, Math.PI/2]){
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.7), mat.woodD);
      beam.position.y = dy;
      beam.rotation.y = side;
      g.add(beam);
    }
  }
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
const towers = [
  makeTower(-4, -2, 2.5),
  makeTower(4, -2, 2.8),
  makeTower(4, 4, 2.2),
  makeTower(-1, 5.5, 2.0),
];

/* ============ fence segments ============ */
function makeFence(x1,z1, x2,z2){
  const dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
  const g = new THREE.Group();
  const n = Math.round(len / 0.5);
  for(let i=0; i<=n; i++){
    const t=i/n;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.6,5), mat.fence);
    post.position.set(x1+dx*t, 0.3, z1+dz*t);
    post.castShadow=true;
    g.add(post);
  }
  // horizontal rails
  for(const h of [0.2, 0.45]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.04, 0.04), mat.fence);
    rail.position.set((x1+x2)/2, h, (z1+z2)/2);
    rail.rotation.y = Math.atan2(dx, dz) + Math.PI/2;
    g.add(rail);
  }
  scene.add(g);
}
makeFence(-6, -5, 6, -5);
makeFence(6, -5, 6, 7);

/* ============ barn ============ */
{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 2), mat.red);
  body.position.y = 0.75; body.castShadow=true; body.receiveShadow=true; g.add(body);
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.08, 2.2), mat.woodD);
  roofL.position.set(-0.45, 1.65, 0); roofL.rotation.z = 0.35; roofL.castShadow=true; g.add(roofL);
  const roofR = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.08, 2.2), mat.woodD);
  roofR.position.set(0.45, 1.65, 0); roofR.rotation.z = -0.35; roofR.castShadow=true; g.add(roofR);
  // doors
  const door = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1), mat.woodD);
  door.position.set(0, 0.5, 1.01); g.add(door);
  g.position.set(-3, 0, -6);
  scene.add(g);
}

/* ============ cart (moves along track) ============ */
const cartGroup = new THREE.Group();
const cartBody = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.7), mat.cart);
cartBody.position.y = 0.25; cartBody.castShadow = true;
cartGroup.add(cartBody);
// gold bars in cart
for(let i=0; i<3; i++){
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.18), mat.gold);
  bar.position.set((i-1)*0.14, 0.45, 0);
  bar.rotation.y = (i-1)*0.2;
  cartGroup.add(bar);
}
// wheels
for(const [dx,dz] of [[-0.25,-0.25],[0.25,-0.25],[0.25,0.25],[-0.25,0.25]]){
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.04,8), mat.rail);
  wheel.position.set(dx, 0.1, dz);
  wheel.rotation.z = Math.PI/2;
  cartGroup.add(wheel);
}
scene.add(cartGroup);

/* ============ snowfall ============ */
const snowCount = 600;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowCount * 3);
const snowVel = new Float32Array(snowCount);
for(let i=0; i<snowCount; i++){
  snowPos[i*3]   = (Math.random()-.5)*30;
  snowPos[i*3+1] = Math.random()*15;
  snowPos[i*3+2] = (Math.random()-.5)*30;
  snowVel[i] = 0.5 + Math.random()*1.5;
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.PointsMaterial({color:'#ffffff', size:0.08, transparent:true, opacity:0.8});
const snow = new THREE.Points(snowGeo, snowMat);
scene.add(snow);

/* ============ orbit controls (minimal) ============ */
let camTheta = Math.PI/4, camPhi = Math.PI/5, camDist = 18;
const camTarget = new THREE.Vector3(0, 0, 1);
function updateCam(){
  camera.position.set(
    camTarget.x + camDist * Math.cos(camPhi) * Math.sin(camTheta),
    camTarget.y + camDist * Math.sin(camPhi),
    camTarget.z + camDist * Math.cos(camPhi) * Math.cos(camTheta)
  );
  camera.lookAt(camTarget);
}
updateCam();

const ptrs = new Map();
let pinch = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), dist: camDist};
  }
});
cv.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size>=2 && pinch){
    const [a,b]=[...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    camDist = Math.max(8, Math.min(30, pinch.dist * (pinch.d / d)));
  } else if(ptrs.size===1){
    camTheta -= dx * 0.006;
    camPhi = Math.max(0.1, Math.min(1.2, camPhi + dy*0.006));
  }
  updateCam();
});
cv.addEventListener('pointerup', e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
});
cv.addEventListener('pointercancel', e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
});

/* ============ resize ============ */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============ FPS counter ============ */
const fpsEl = document.getElementById('fps');
let frames=0, lastFps=performance.now();

/* ============ animate ============ */
let cartT = 0;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // cart
  cartT = (cartT + dt * 0.06) % 1;
  const cartPos = curve.getPointAt(cartT);
  const cartTan = curve.getTangentAt(cartT);
  cartGroup.position.copy(cartPos);
  cartGroup.position.y = 0.05;
  cartGroup.lookAt(cartPos.x + cartTan.x, 0.05, cartPos.z + cartTan.z);

  // snow
  const pos = snowGeo.attributes.position.array;
  for(let i=0; i<snowCount; i++){
    pos[i*3+1] -= snowVel[i] * dt;
    pos[i*3]   += Math.sin(performance.now()*0.001 + i) * 0.003;
    if(pos[i*3+1] < 0){
      pos[i*3+1] = 12 + Math.random()*3;
      pos[i*3]   = (Math.random()-.5)*30;
      pos[i*3+2] = (Math.random()-.5)*30;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);

  // fps
  frames++;
  const now = performance.now();
  if(now - lastFps >= 500){
    fpsEl.textContent = Math.round(frames / ((now-lastFps)/1000)) + ' fps';
    frames = 0; lastFps = now;
  }
}
animate();
</script>
</body>
