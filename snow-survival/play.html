/* ================ TREES ================ */
function makeTree(x,z,h){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,h*.3,6),M.wood);
  trunk.position.y=h*.15;trunk.castShadow=true;g.add(trunk);
  const ly=3+Math.floor(Math.random()*2);
  for(let i=0;i<ly;i++){
    const t=i/ly,r=(1-t*.7)*h*.35;
    const c=new THREE.Mesh(new THREE.ConeGeometry(r,h/ly*1.1,7),i%2===0?M.green:M.greenD);
    c.position.y=h*.3+(h*.7)*(i+.5)/ly;c.castShadow=true;c.receiveShadow=true;g.add(c);
  }
  for(let i=0;i<ly;i++){
    const t=i/ly,r=(1-t*.7)*h*.33;
    const cap=new THREE.Mesh(new THREE.ConeGeometry(r,.15,7),M.snow);
    cap.position.y=h*.3+(h*.7)*(i+1)/ly-.1;g.add(cap);
  }
  g.position.set(x,0,z);scene.add(g);
}

/* ================ SNOWFALL ================ */
const snowN=500,snowGeo=new THREE.BufferGeometry();
const snowP=new Float32Array(snowN*3),snowV=new Float32Array(snowN);
for(let i=0;i<snowN;i++){snowP[i*3]=(Math.random()-.5)*40;snowP[i*3+1]=Math.random()*15;snowP[i*3+2]=(Math.random()-.5)*40;snowV[i]=.5+Math.random()*1.5;}
snowGeo.setAttribute('position',new THREE.BufferAttribute(snowP,3));
scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({color:'#fff',size:.08,transparent:true,opacity:.8})));
function updateSnow(dt,cx,cz){
  const p=snowGeo.attributes.position.array;
  for(let i=0;i<snowN;i++){p[i*3+1]-=snowV[i]*dt;p[i*3]+=Math.sin(performance.now()*.001+i)*.003;
    if(p[i*3+1]<0){p[i*3+1]=12+Math.random()*3;p[i*3]=cx+(Math.random()-.5)*35;p[i*3+2]=cz+(Math.random()-.5)*35;}}
  snowGeo.attributes.position.needsUpdate=true;
}

  const rl=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.3,6),M.brown);rl.position.set(.1,.15,0);rl.castShadow=true;g.add(rl);
  const bd=new THREE.Mesh(new THREE.CylinderGeometry(.2,.22,.55,8),bodyMat);bd.position.y=.58;bd.castShadow=true;g.add(bd);
  const la=new THREE.Mesh(new THREE.CylinderGeometry(.055,.06,.4,6),bodyMat);la.position.set(-.28,.6,0);la.castShadow=true;g.add(la);
  const ra=new THREE.Mesh(new THREE.CylinderGeometry(.055,.06,.4,6),bodyMat);ra.position.set(.28,.6,0);ra.castShadow=true;g.add(ra);
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),M.skin);hd.position.y=1.05;hd.castShadow=true;g.add(hd);
  const ht=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,.1,8),bodyMat);ht.position.y=1.2;g.add(ht);
  return{mesh:g,ll,rl,la,ra,wp:0};
}
function animateChar(ch,moving,dt){
  if(moving){ch.wp+=dt*10;const s=Math.sin(ch.wp)*.25;
    ch.ll.rotation.x=s;ch.rl.rotation.x=-s;ch.la.rotation.x=-s*.7;ch.ra.rotation.x=s*.7;
  }else{ch.ll.rotation.x=0;ch.rl.rotation.x=0;ch.la.rotation.x=0;ch.ra.rotation.x=0;}
}

[{type:'ore',x:8,z:10},{type:'ore',x:-10,z:6},{type:'wood',x:-8,z:-7},{type:'wood',x:11,z:-5},{type:'meat',x:5,z:-11}].forEach(def=>{

document.querySelectorAll('.bitem').forEach(el=>{
  function handler(e){e.preventDefault();e.stopPropagation();
    const t=el.dataset.type;
    if(eco.money<BUILD[t].cost)return;
    closeMenu();enterPlace(t);
  }
  el.addEventListener('touchstart',handler,{passive:false});
  el.addEventListener('click',handler);
});

function updateMenuItems(){
  document.querySelectorAll('.bitem').forEach(el=>{
    const t=el.dataset.type;
    el.classList.toggle('disabled',eco.money<BUILD[t].cost);
  });
}

function getPlacePos(){
  const px=player.position.x+2.5*Math.sin(player.rotation.y);
  const pz=player.position.z+2.5*Math.cos(player.rotation.y);
  return{x:px,z:pz};
}

function enterPlace(type){
  placeType=type;
  ghostDisc.visible=true;
  placeUI.style.display='flex';
  buildBtn.style.display='none';
}
function cancelPlace(){
  placeType=null;
  ghostDisc.visible=false;
  placeUI.style.display='none';
  buildBtn.style.display='flex';
}

function canPlace(x,z){
  if(Math.sqrt(x*x+z*z)<3)return false;
  for(const b of buildings){if(Math.hypot(b.x-x,b.z-z)<2)return false;}
  if(placeType==='depot'){
    let near=false;
    for(const r of resList){if(Math.hypot(r.pos.x-x,r.pos.z-z)<4)near=true;}
    if(!near)return false;
  }
  return true;
}

function confirmPlace(){
  const pp=getPlacePos();
  if(!canPlace(pp.x,pp.z))return;
  if(eco.money<BUILD[placeType].cost)return;
  eco.money-=BUILD[placeType].cost;

  let mesh;
  if(placeType==='fence')mesh=makeFenceModel();
  else if(placeType==='tower')mesh=makeTowerModel();
  else if(placeType==='hut')mesh=makeHutModel();
  else mesh=makeDepotModel();

  mesh.position.set(pp.x,0,pp.z);
  if(placeType==='fence')mesh.rotation.y=player.rotation.y;
  scene.add(mesh);
  buildings.push({type:placeType,x:pp.x,z:pp.z,mesh});

  if(placeType==='hut')spawnWorker(pp.x,pp.z);
  if(placeType==='depot')spawnTrack(pp.x,pp.z);

  cancelPlace();
}

placeOk.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();confirmPlace();},{passive:false});
placeOk.addEventListener('click',function(e){e.stopPropagation();confirmPlace();});
placeNo.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();cancelPlace();},{passive:false});
placeNo.addEventListener('click',function(e){e.stopPropagation();cancelPlace();});

/* ================ WORKERS ================ */
function spawnWorker(hx,hz){
  const ch=makeCharacter(M.orange);
  ch.mesh.position.set(hx+1,0,hz);
  scene.add(ch.mesh);
  workerList.push({
    ch, state:'toResource', target:null,
    bag:{ore:0,wood:0,meat:0}, bagCap:5,
    speed:3, collectProgress:0,
    homePos:new THREE.Vector3(hx,0,hz),
  });
}

function wTotal(w){return w.bag.ore+w.bag.wood+w.bag.meat;}
function wFull(w){return wTotal(w)>=w.bagCap;}

function nearestRes(pos){
  let best=null,bd=Infinity;
  for(const r of resList){const d=pos.distanceTo(r.pos);if(d<bd){bd=d;best=r;}}
  return best;
}

function updateWorker(w,dt){
  const pos=w.ch.mesh.position;

  if(w.state==='toResource'){
    if(!w.target)w.target=nearestRes(pos);
    if(!w.target)return;
    const dx=w.target.pos.x-pos.x, dz=w.target.pos.z-pos.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<1.5){w.state='collecting';w.collectProgress=0;return;}
    const s=w.speed*dt/d;
    pos.x+=dx*s; pos.z+=dz*s;
    w.ch.mesh.rotation.y=Math.atan2(dx,dz);
    animateChar(w.ch,true,dt);
  }
  else if(w.state==='collecting'){
    if(!w.target){w.state='toResource';return;}
    w.collectProgress+=dt/2;
    if(w.collectProgress>=1){
      w.bag[w.target.type]++;
      w.collectProgress=0;
      if(wFull(w)){w.state='toSell';w.target=null;}
    }
    animateChar(w.ch,false,dt);
  }
  else if(w.state==='toSell'){
    const dx=sellPos.x-pos.x, dz=sellPos.z-pos.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<2){
      let earned=0;
      for(const t of['ore','wood','meat']){earned+=w.bag[t]*eco.prices[t];w.bag[t]=0;}
      eco.money+=earned;
      w.state='toResource';w.target=null;
      return;
    }
    const s=w.speed*dt/d;
    pos.x+=dx*s; pos.z+=dz*s;
    w.ch.mesh.rotation.y=Math.atan2(dx,dz);
    animateChar(w.ch,true,dt);
  }
}

/* ================ RAIL & MINECART ================ */
function spawnTrack(dx,dz){
  const start=new THREE.Vector3(dx,0,dz);
  const end=new THREE.Vector3(0,0,0);
  const diff=new THREE.Vector3().subVectors(end,start);
  const len=diff.length();
  const angle=Math.atan2(diff.x,diff.z);
  const perpX=Math.cos(angle),perpZ=-Math.sin(angle);
  const midX=(dx)/2,midZ=(dz)/2;

  const tg=new THREE.Group();
  const nTies=Math.floor(len/.5);
  for(let i=0;i<=nTies;i++){
    const t=i/nTies;
    const tie=new THREE.Mesh(new THREE.BoxGeometry(.6,.04,.08),M.woodD);
    tie.position.set(dx+diff.x*t,.02,dz+diff.z*t);tie.rotation.y=angle;tie.castShadow=true;tg.add(tie);
  }
  for(const off of[-.22,.22]){
    const rl=new THREE.Mesh(new THREE.BoxGeometry(.04,.06,len),M.rail);
    rl.position.set(midX+perpX*off,.05,midZ+perpZ*off);rl.rotation.y=angle;tg.add(rl);
  }
  scene.add(tg);

  const cg=new THREE.Group();
  const cb=new THREE.Mesh(new THREE.BoxGeometry(.5,.3,.7),M.cart);cb.position.y=.25;cb.castShadow=true;cg.add(cb);
  for(const[cx2,cz2]of[[-0.25,-0.25],[0.25,-0.25],[0.25,0.25],[-0.25,0.25]]){
    const wh=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.04,8),M.rail);wh.position.set(cx2,.1,cz2);wh.rotation.z=Math.PI/2;cg.add(wh);
  }
  scene.add(cg);

  let nearRes=null,nearD=Infinity;
  for(const r of resList){const d2=Math.hypot(r.pos.x-dx,r.pos.z-dz);if(d2<nearD){nearD=d2;nearRes=r;}}

  trackList.push({
    start,end,cart:cg,t:0,dir:1,speed:4,len,
    pause:0,bag:{ore:0,wood:0,meat:0},bagCap:5,
    res:nearRes,angle,
  });
}

function updateTrack(tr,dt){
  if(tr.pause>0){tr.pause-=dt;return;}

  tr.t+=tr.dir*tr.speed*dt/tr.len;

  if(tr.t>=1){
    tr.t=1;tr.dir=-1;tr.pause=1;
    let earned=0;
    for(const t of['ore','wood','meat']){earned+=tr.bag[t]*eco.prices[t];tr.bag[t]=0;}
    eco.money+=earned;
  }
  if(tr.t<=0){
    tr.t=0;tr.dir=1;tr.pause=1.5;
    if(tr.res){for(let i=0;i<tr.bagCap;i++)tr.bag[tr.res.type]++;}
  }

  const px=tr.start.x+(tr.end.x-tr.start.x)*tr.t;
  const pz=tr.start.z+(tr.end.z-tr.start.z)*tr.t;
  tr.cart.position.set(px,.05,pz);
  tr.cart.rotation.y=tr.angle+(tr.dir<0?Math.PI:0);
}

/* ================ JOYSTICK ================ */
const joyEl=document.getElementById('joy');
const knobEl=document.getElementById('knob');
const joyState={x:0,z:0,active:false};
const JOY_MAX=42;
function joyCenter(){const r=joyEl.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function joyMove(cx,cy){const c=joyCenter();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);
  if(d>JOY_MAX){dx=dx/d*JOY_MAX;dy=dy/d*JOY_MAX;}knobEl.style.transform='translate('+dx+'px,'+dy+'px)';joyState.x=dx/JOY_MAX;joyState.z=dy/JOY_MAX;}
function joyEnd(){joyState.active=false;joyState.x=0;joyState.z=0;knobEl.style.transform='translate(0px,0px)';}
joyEl.addEventListener('touchstart',function(e){e.preventDefault();joyState.active=true;joyMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
joyEl.addEventListener('touchmove',function(e){e.preventDefault();if(joyState.active)joyMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
joyEl.addEventListener('touchend',function(e){e.preventDefault();joyEnd();},{passive:false});
joyEl.addEventListener('touchcancel',function(){joyEnd();});
joyEl.addEventListener('mousedown',function(e){joyState.active=true;joyMove(e.clientX,e.clientY);
  function mm(e2){if(joyState.active)joyMove(e2.clientX,e2.clientY);}
  function mu(){joyEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);}
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
});

/* ================ CAMERA ================ */
const CAM_THETA=Math.PI/4,CAM_PHI=Math.PI/5,CAM_DIST=15;
const sinT=Math.sin(CAM_THETA),cosT=Math.cos(CAM_THETA);
function updateCam(tgt){
  camera.position.set(tgt.x+CAM_DIST*Math.cos(CAM_PHI)*Math.sin(CAM_THETA),tgt.y+CAM_DIST*Math.sin(CAM_PHI),tgt.z+CAM_DIST*Math.cos(CAM_PHI)*Math.cos(CAM_THETA));
  camera.lookAt(tgt.x,tgt.y+.5,tgt.z);
}
const _proj=new THREE.Vector3();
function w2s(x,y,z){_proj.set(x,y,z).project(camera);return{x:(.5+_proj.x*.5)*window.innerWidth,y:(.5-_proj.y*.5)*window.innerHeight};}

/* ================ UI REFS ================ */
const fpsEl=document.getElementById('fps');
const hudEl=document.getElementById('hud');
const barEl=document.getElementById('bar');
const barFillEl=document.getElementById('barFill');
const fullEl=document.getElementById('full');
const sellPopEl=document.getElementById('sellPop');

window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

/* ================ GAME LOOP ================ */
updateCam(player.position);
let lastTime=performance.now(),fpsFrames=0,fpsLast=performance.now();

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min((now-lastTime)/1000,.1);
  lastTime=now;

  // joystick → world
  const wx=joyState.x*cosT+joyState.z*sinT;
  const wz=-joyState.x*sinT+joyState.z*cosT;
  const moving=Math.abs(joyState.x)>.05||Math.abs(joyState.z)>.05;

  if(moving){
    player.position.x+=wx*5*dt;player.position.z+=wz*5*dt;
    player.position.x=Math.max(-22,Math.min(22,player.position.x));
    player.position.z=Math.max(-22,Math.min(22,player.position.z));
    player.rotation.y=Math.atan2(wx,wz);
  }
  animateChar(pc,moving,dt);

  updateCam(player.position);
  sun.position.set(player.position.x+8,15,player.position.z+6);
  sun.target.position.copy(player.position);sun.target.updateMatrixWorld();

  // placement ghost
  if(placeType){
    const pp=getPlacePos();
    ghostDisc.position.set(pp.x,.02,pp.z);
    const ok=canPlace(pp.x,pp.z);
    ghostDisc.material.color.set(ok?'#40ff40':'#ff4040');
  }

  // resource collection (player)
  let collecting=null;
  for(const r of resList){
    const d=player.position.distanceTo(r.pos);
    if(d<1.8&&!eco.isFull()){r.progress+=dt/1.8;if(r.progress>=1){eco.add(r.type);r.progress=0;}collecting={progress:r.progress};}
    else{r.progress=Math.max(0,r.progress-dt*2);}
  }

  // sell station (player)
  sellCooldown=Math.max(0,sellCooldown-dt);
  let earned=0;
  if(sellCooldown<=0&&player.position.distanceTo(sellPos)<2&&eco.total()>0){earned=eco.sellAll();sellCooldown=.5;}

  // workers
  for(const w of workerList)updateWorker(w,dt);

  // tracks
  for(const tr of trackList)updateTrack(tr,dt);

  // HUD
  const wc=workerList.length, tc=trackList.length;
  hudEl.innerHTML='<span style="color:#ffe040">💰 '+eco.money+'</span><br>🎒 '+eco.total()+'/'+eco.cap
    +(eco.bag.ore?' · 矿'+eco.bag.ore:'')+(eco.bag.wood?' · 木'+eco.bag.wood:'')+(eco.bag.meat?' · 肉'+eco.bag.meat:'')
    +(wc?' · 👷'+wc:'')+(tc?' · 🚃'+tc:'');

  // floating UI
  const head=w2s(player.position.x,player.position.y+1.5,player.position.z);
  if(collecting){barEl.style.display='block';barEl.style.left=(head.x-28)+'px';barEl.style.top=(head.y-18)+'px';barFillEl.style.width=(collecting.progress*100)+'%';fullEl.style.display='none';}
  else if(eco.isFull()){barEl.style.display='none';fullEl.style.display='block';fullEl.style.left=(head.x-28)+'px';fullEl.style.top=(head.y-22)+'px';}
  else{barEl.style.display='none';fullEl.style.display='none';}

  if(earned>0){const ss=w2s(0,2.5,0);sellPopEl.textContent='+$'+earned;
    sellPopEl.style.left=(ss.x-20)+'px';sellPopEl.style.top=ss.y+'px';
    sellPopEl.style.transition='none';sellPopEl.style.opacity='1';sellPopEl.style.transform='translateY(0)';
    void sellPopEl.offsetWidth;sellPopEl.style.transition='transform .8s ease-out,opacity .8s ease-out';
    sellPopEl.style.opacity='0';sellPopEl.style.transform='translateY(-40px)';}

  updateSnow(dt,player.position.x,player.position.z);
  renderer.render(scene,camera);

  fpsFrames++;
  if(now-fpsLast>=500){fpsEl.textContent=Math.round(fpsFrames/((now-fpsLast)/1000))+' fps';fpsFrames=0;fpsLast=now;}
}
animate();
</script>
