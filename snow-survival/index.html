<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8cfe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>雪地生存</title>
<style>
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;background:#b8cfe0;touch-action:none;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#dbg{position:fixed;top:40%;left:10%;right:10%;background:rgba(0,0,0,.8);color:#0f0;
     font:13px/1.6 monospace;padding:16px;border-radius:12px;z-index:99999;
     word-break:break-all;max-height:50%;overflow:auto;}
</style>
</head>
<body>
<div id="dbg">Loading...</div>
<script>
// Pre-module diagnostics — catches errors modules can't
var dbg = document.getElementById('dbg');
var logs = ['[boot] page loaded'];

function addLog(s) {
  logs.push(s);
  dbg.textContent = logs.join('\n');
  dbg.style.display = 'block';
}

window.onerror = function(msg, src, line, col, err) {
  addLog('[ERROR] ' + msg + ' @ ' + (src||'?') + ':' + line);
};
window.onunhandledrejection = function(e) {
  addLog('[REJECT] ' + (e.reason ? (e.reason.message || e.reason) : 'unknown'));
};

// Unregister old service workers that might serve stale cache
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.unregister(); });
    if (regs.length) addLog('[sw] unregistered ' + regs.length + ' old SW(s)');
  });
}

// If game hasn't started in 8 seconds, show diagnostic
window._gameStarted = false;
setTimeout(function() {
  if (!window._gameStarted) {
    addLog('[TIMEOUT] game did not start within 8s');
    addLog('[info] UA: ' + navigator.userAgent.substring(0, 80));
    addLog('[info] screen: ' + screen.width + 'x' + screen.height);
    addLog('[info] webgl: ' + (function(){
      try {
        var c = document.createElement('canvas');
        return !!(c.getContext('webgl2') || c.getContext('webgl'));
      } catch(e) { return false; }
    })());
  }
}, 8000);
</script>

</html>
