<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8cfe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Rail Defense</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#b8cfe0;font-family:system-ui,sans-serif;
  -webkit-user-select:none;user-select:none}
#canvas-container{width:100%;height:100%;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

#fps{position:fixed;top:env(safe-area-inset-top,0px);right:8px;
  color:#fff;font:600 11px/1 ui-monospace,monospace;
  background:rgba(0,0,0,.4);padding:4px 7px;border-radius:6px;
  z-index:20;pointer-events:none}

#hud{position:fixed;top:env(safe-area-inset-top,0px);left:8px;
  display:flex;gap:10px;z-index:20;pointer-events:none}
.res{display:flex;align-items:center;gap:4px;
  background:rgba(0,0,0,.5);color:#fff;
  padding:5px 9px;border-radius:8px;font:700 14px/1 system-ui}
.ri{font-size:15px}

#build-panel{position:fixed;
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  left:0;right:0;display:flex;gap:8px;padding:8px 12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  z-index:20;justify-content:center}
#build-panel::-webkit-scrollbar{display:none}

.build-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:8px 12px;
  background:rgba(0,0,0,.55);color:#fff;
  border:2px solid transparent;border-radius:12px;
  font:600 11px/1.2 system-ui;cursor:pointer;
  -webkit-tap-highlight-color:transparent;min-width:56px;
  transition:background .15s,border-color .15s}
.build-btn:active{background:rgba(0,0,0,.75)}
.build-btn.active{border-color:#4af;background:rgba(40,120,200,.55)}
.bi{font-size:20px;line-height:1}
.bl{font-size:11px}
.bc{font-size:10px;opacity:.7}
.cancel-btn{background:rgba(180,40,40,.55)}
.cancel-btn:active{background:rgba(200,60,60,.75)}

#mode-ind{position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 34px);
  left:0;right:0;text-align:center;
  color:#fff;font:600 13px/1.5 system-ui;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  pointer-events:none;z-index:20}

#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font:700 15px/1.4 system-ui;
  text-shadow:0 2px 6px rgba(0,0,0,.5);
  background:rgba(0,0,0,.45);padding:7px 14px;border-radius:10px;
  pointer-events:none;z-index:30;opacity:0;transition:opacity .2s}
#msg.show{opacity:1}

#wave-info{position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 2px);
  left:50%;transform:translateX(-50%);
  text-align:center;z-index:20;pointer-events:none}
#wave-txt{color:#fff;font:700 13px/1.4 system-ui;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  background:rgba(0,0,0,.45);padding:4px 12px;border-radius:8px;
  white-space:nowrap}
#base-hp-wrap{width:120px;height:8px;margin:4px auto 0;
  background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
#base-hp-bar{height:100%;width:100%;background:#4c4;
  transition:width .3s,background .3s;border-radius:4px}

#wave-btn{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
  background:rgba(40,140,60,.85);color:#fff;border:2px solid rgba(255,255,255,.3);
  padding:14px 28px;border-radius:14px;font:800 17px/1 system-ui;
  cursor:pointer;z-index:25;-webkit-tap-highlight-color:transparent;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
  animation:pulse 1.8s ease-in-out infinite}
#wave-btn:active{background:rgba(40,160,60,.95)}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.05)}}

#game-over{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.65);z-index:50}
.go-text{color:#fff;font:900 42px/1 system-ui;
  text-shadow:0 3px 12px rgba(0,0,0,.6)}
.go-sub{color:rgba(255,255,255,.8);font:600 16px/1.5 system-ui;margin-top:10px}
.restart-btn{margin-top:20px;background:rgba(40,140,60,.85);color:#fff;
  border:2px solid rgba(255,255,255,.3);padding:12px 28px;border-radius:12px;
  font:700 16px/1 system-ui;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.restart-btn:active{background:rgba(40,160,60,.95)}

#upg-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:16px 20px;border-radius:14px;
  border:2px solid rgba(255,255,255,.2);z-index:35;text-align:center;
  min-width:200px}
.upg-title{font:700 16px/1.3 system-ui;margin-bottom:6px}
.upg-info{font:400 13px/1.4 system-ui;opacity:.85;margin-bottom:12px}
.upg-btns{display:flex;gap:8px;justify-content:center}
.upg-action{background:rgba(40,140,60,.85);color:#fff;border:none;
  padding:8px 16px;border-radius:8px;font:600 13px/1 system-ui;cursor:pointer}
.upg-action:active{background:rgba(40,160,60,.95)}
.upg-close-btn{background:rgba(180,40,40,.6);color:#fff;border:none;
  padding:8px 14px;border-radius:8px;font:600 13px/1 system-ui;cursor:pointer}
.upg-close-btn:active{background:rgba(200,60,60,.75)}
</style>
</head>
<body>
<div id="fps">-- fps</div>
<div id="canvas-container"></div>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"}}

<script type="module" src="src/main.js"></script>
<script>
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
